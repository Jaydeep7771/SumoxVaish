<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1C1A22" />
    <meta name="color-scheme" content="dark" />
    <!-- Painted before the stylesheet loads, so there is no white flash. -->
    <style>
      html { background: #1C1A22; }
      body { margin: 0; background: #1C1A22; }
    </style>
    <title>Vaishali &amp; Sumit</title>
    <meta name="description" content="Vaishali &amp; Sumit are tying the knot on 5 December 2026 in Zirakpur, Punjab." />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The link will mostly be shared over WhatsApp, so it needs a card.
         Once the final domain is live, make the two URLs below absolute
         (https://yourdomain/og-image.jpg) -- some scrapers will not resolve a
         relative image. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vaishali &amp; Sumit" />
    <meta property="og:description" content="Together with our families — 5 December 2026, Zirakpur, Punjab." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vaishali &amp; Sumit" />
    <meta name="twitter:description" content="Together with our families — 5 December 2026, Zirakpur, Punjab." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mukta:wght@300;400;500;600&family=Caveat:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
